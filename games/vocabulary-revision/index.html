<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vocabulary Revision</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07152f;color:#fff;font-family:"Trebuchet MS",Arial,sans-serif}main{max-width:1300px;margin:auto;padding:8px}.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.title{font-size:clamp(24px,4vw,40px);font-weight:900}.title span{color:#ffd84d}.back,.stat,.sound,.ctrl{background:#10295b;border:2px solid #4b7bea;color:#fff;border-radius:14px;font-weight:900}.back{padding:9px 13px;text-decoration:none}.sound{padding:9px 12px}.stats{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}.stat{padding:7px 10px}.game{position:relative;margin-top:7px;border:5px solid #3157ad;border-radius:24px;overflow:hidden;background:#75d7f6;box-shadow:0 16px 50px #0009}.game canvas{display:block;width:100%;height:auto}.controls{display:flex;justify-content:center;gap:10px;padding:9px}.ctrl{width:76px;height:54px;font-size:25px;box-shadow:0 5px #06132b}.ctrl:active{transform:translateY(4px);box-shadow:0 1px #06132b}.help{text-align:center;color:#cdd9f4;font-weight:800;font-size:13px}.modal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#02091bdd;padding:12px}.modal.show{display:flex}.card{width:min(720px,95%);background:#fff;color:#182448;border:5px solid #ffd84d;border-radius:26px;padding:22px;text-align:center;box-shadow:0 18px 50px #000b}.card h2{margin:0 0 8px;color:#6331b7}.context{font-size:21px;font-weight:900;background:#edf5ff;border-radius:15px;padding:12px}.target{color:#6534c6;text-decoration:underline}.hint{background:#fff3bd;padding:9px;border-radius:12px;font-weight:900;margin:9px 0}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.answer,.restart{border:0;border-radius:15px;padding:14px;font-size:18px;font-weight:900;color:#fff}.answer:nth-child(1){background:#287ce7}.answer:nth-child(2){background:#ef7a31}.answer:nth-child(3){background:#29b968}.feedback{min-height:25px;margin-top:10px;font-weight:900}.restart{background:#7040b8;margin-top:8px}@media(max-width:650px){.stats{width:100%;margin-left:0}.stat{font-size:12px}.answers{grid-template-columns:1fr}.context{font-size:17px}.ctrl{width:64px}}
</style>
</head>
<body>
<main>
<header class="top"><div class="title">Vocabulary <span>Revision</span></div><a class="back" href="../../">← Game Hub</a><button class="sound" id="sound">🔊 Sound ON</button><div class="stats"><div class="stat">💍 <b id="rings">0</b>/12</div><div class="stat">⭐ <b id="score">0</b></div><div class="stat">❤️ <b id="lives">3</b></div><div class="stat">🧠 <b id="done">0</b>/12</div></div></header>
<section class="game">
<canvas id="c" width="1280" height="650"></canvas>
<div class="modal" id="q"><div class="card"><h2>💨 SPEED CHALLENGE!</h2><div class="hint">Use the context clue to unlock your ring.</div><div class="context" id="sentence"></div><p>What does <b class="target" id="word"></b> mean?</p><div class="answers"><button class="answer" data-i="0"></button><button class="answer" data-i="1"></button><button class="answer" data-i="2"></button></div><div class="feedback" id="feedback"></div></div></div>
<div class="modal" id="pause"><div class="card"><h2>⏸ PAUSED</h2><button class="restart" id="resume">▶ RUN AGAIN</button></div></div>
<div class="modal" id="end"><div class="card"><h2 id="endTitle"></h2><p id="endText"></p><button class="restart" id="again">🔄 PLAY AGAIN</button></div></div>
</section>
<div class="controls"><button class="ctrl" data-k="left">◀</button><button class="ctrl" data-k="jump">▲</button><button class="ctrl" data-k="right">▶</button><button class="ctrl" id="pause">⏸</button></div>
<p class="help">← → / A D = RUN • ↑ / W / SPACE = JUMP • Collect 💍 rings • Answer to continue • Reach the FINISH</p>
</main>
<script>
(()=>{'use strict';
const C=document.getElementById('c'),g=C.getContext('2d'),W=1280,H=650;
const qs=[
['goal','Kick the ball into the goal to score.','the place where you score',['the place where you score','a person who drives a train','a storm in the sky']],
['goalie','The goalie stopped the ball with his hands.','the player who protects the goal',['the player who protects the goal','people watching a game','a place in outer space']],
['leader','The children follow the leader in the game.','a person others follow',['a person others follow','a train worker','a strong storm']],
['stands','The people in the stands cheer for the team.','seats where people watch a game',['seats where people watch a game','a moving train','a fancy dinner plate']],
['aboard','We climbed aboard the train.','onto or into a vehicle',['onto or into a vehicle','very expensive','bright lightning']],
['conductor','The conductor tells when the train leaves.','a person who works on a train',['a person who works on a train','a soccer player','a storm cloud']],
['fancy','The table has fancy plates.','special and beautiful',['special and beautiful','very loud','a place with stars']],
['space','There are many stars in space.','the area beyond Earth',['the area beyond Earth','people in a stadium','a train worker']],
['hail','Icy hail fell during the storm.','small balls of ice that fall from the sky',['small balls of ice that fall from the sky','a bright flash of light','a spinning storm']],
['lightning','The lightning from the storm lit up the sky.','a bright flash of electricity in the sky',['a bright flash of electricity in the sky','loud storm sound','a soccer goal']],
['thunder','The thunder was so loud that it hurt my ears.','a loud sound during a storm',['a loud sound during a storm','ice falling from the sky','a team leader']],
['tornado','The tornado destroyed everything in its path.','a powerful spinning column of air',['a powerful spinning column of air','a train worker','a beautiful plate']]
];
let score=0,rings=0,lives=3,done=0,qi=0,paused=false,asking=false,ended=false,cam=0,last=80,audio=null,music=null;
let keys={l:false,r:false},p,items,plats,boosts;
const E=id=>document.getElementById(id);
function stats(){E('rings').textContent=rings;E('score').textContent=score;E('lives').textContent=lives;E('done').textContent=done}
function build(){p={x:80,y:455,w:42,h:62,vy:0,on:false,face:1,run:0,speed:0};plats=[{x:0,y:520,w:900,h:50},{x:980,y:470,w:650,h:40},{x:1720,y:530,w:700,h:45},{x:2520,y:455,w:760,h:40},{x:3380,y:520,w:780,h:50},{x:4260,y:465,w:720,h:40},{x:5080,y:520,w:950,h:50}];const xs=[300,610,1120,1450,1840,2160,2650,3020,3520,3890,4460,4800];items=xs.map((x,i)=>({x,y:plats[i<2?0:i<4?1:i<6?2:i<8?3:i<10?4:i<11?5:6].y-55,got:false}));boosts=[{x:780,y:480},{x:1550,y:430},{x:3160,y:415},{x:4070,y:480}]}
function reset(){score=0;rings=0;lives=3;done=0;qi=0;paused=false;asking=false;ended=false;cam=0;build();hide();stats()}
function hide(){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('show'))}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function audioInit(){if(audio){audio.resume();return}try{audio=new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch(e){}}
function tone(f,d,type='square',v=.06,delay=0){if(!audio)return;const o=audio.createOscillator(),a=audio.createGain();o.type=type;o.frequency.value=f;a.gain.setValueAtTime(.0001,audio.currentTime+delay);a.gain.exponentialRampToValueAtTime(v,audio.currentTime+delay+.01);a.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+delay+d);o.connect(a);a.connect(audio.destination);o.start(audio.currentTime+delay);o.stop(audio.currentTime+delay+d+.02)}
function startMusic(){if(!audio||music)return;let n=0;const m=[330,392,494,392,523,440,392,330];music=setInterval(()=>{if(!paused&&!ended&&!asking){tone(m[n%8],.13,'square',.035);if(n%2===0)tone(165,.09,'triangle',.02)}n++},180)}
function stopMusic(){clearInterval(music);music=null}
function jump(){audioInit();if(!paused&&!asking&&!ended&&p.on){p.vy=-14;p.on=false;tone(420,.08,'square',.06);tone(650,.1,'square',.04,.07)}}
function ask(){asking=true;paused=true;keys.l=keys.r=false;const q=qs[qi++%12];E('word').textContent=q[0];E('sentence').innerHTML=q[1].replace(q[0],'<span class="target">'+q[0]+'</span>');document.querySelectorAll('.answer').forEach((b,i)=>b.textContent=q[3][i]);E('q').dataset.a=q[2];E('feedback').textContent='';E('q').classList.add('show');tone(880,.12,'sine',.05)}
function answer(i){if(!asking)return;const q=qs[(qi-1)%12],ok=q[3][i]===q[2];if(ok){score+=80;done++;tone(523,.08);tone(659,.08,'square',.06,.09);tone(784,.13,'square',.06,.18);E('feedback').textContent='🎉 Correct! +80';E('feedback').style.color='#15904a';setTimeout(()=>{E('q').classList.remove('show');asking=false;paused=false;stats();startMusic()},650)}else{lives--;tone(150,.18,'sawtooth',.06);stats();E('feedback').textContent=lives?'❌ Try again! -1 ❤️':'❌ No lives left!';E('feedback').style.color='#d33b5f';if(!lives)setTimeout(()=>finish(false),800)}}
function finish(win){ended=true;paused=true;stopMusic();hide();if(win){tone(523,.12);tone(659,.12,'triangle',.08,.12);tone(784,.16,'triangle',.08,.24)}E('endTitle').textContent=win?'🏆 VOCABULARY SUPERSTAR!':'💙 NICE TRY!';E('endText').textContent=win?'12 rings collected • 12 vocabulary challenges solved • FINISH reached! Score: '+score+' ⭐':'You collected '+rings+' rings and solved '+done+' challenges. Run again!';E('end').classList.add('show')}
function update(){if(paused||asking||ended)return;let dir=(keys.r?1:0)-(keys.l?1:0);if(dir){p.face=dir;p.speed=Math.min(10,p.speed+.35)}else p.speed*=.86;p.x+=dir*p.speed;p.vy+=.68;const old=p.y;p.y+=p.vy;p.on=false;for(const q of plats)if(p.x+p.w>q.x&&p.x<q.x+q.w&&old+p.h<=q.y&&p.y+p.h>=q.y&&p.vy>=0){p.y=q.y-p.h;p.vy=0;p.on=true}for(const b of boosts)if(hit(p,{x:b.x-15,y:b.y-15,w:30,h:30})){p.speed=14;score+=5;b.x=-999;tone(700,.08,'square',.07);tone(900,.1,'square',.05,.08)}if(p.y>H+100){p.x=Math.max(50,p.x-250);p.y=300;p.vy=0;p.speed=0;lives--;stats();if(lives<=0)finish(false)}for(const it of items)if(!it.got&&hit(p,{x:it.x-18,y:it.y-18,w:36,h:36})){it.got=true;rings++;score+=20;stats();tone(700,.08,'triangle',.08);tone(1000,.12,'triangle',.06,.08);ask();return}if(rings===12&&done===12&&p.x>5850)finish(true);cam+=(Math.max(0,Math.min(5000,p.x-350))-cam)*.13;p.run+=p.speed*.22}
function drawSonic(){const X=p.x-cam,Y=p.y,b=Math.sin(p.run)*3;g.save();g.translate(X+21,Y+31+b);g.scale(p.face,1);g.fillStyle='#164b9d';g.beginPath();g.ellipse(0,35,25,6,0,0,Math.PI*2);g.fill();g.fillStyle='#1167dc';g.beginPath();g.moveTo(-22,-10);g.lineTo(-31,-35);g.lineTo(-12,-22);g.lineTo(-5,-43);g.lineTo(5,-23);g.lineTo(25,-35);g.lineTo(19,-8);g.arc(0,-8,22,0,Math.PI*2);g.fill();g.fillStyle='#f5c9a8';g.beginPath();g.ellipse(5,-2,14,12,0,0,Math.PI*2);g.fill();g.fillStyle='#fff';g.beginPath();g.ellipse(-7,-13,7,10,0,0,Math.PI*2);g.ellipse(8,-13,7,10,0,0,Math.PI*2);g.fill();g.fillStyle='#111';g.beginPath();g.arc(-5,-13,2.5,0,7);g.arc(9,-13,2.5,0,7);g.fill();g.fillStyle='#e32e3e';g.fillRect(-22,17,9,22);g.fillRect(14,17,9,22);g.fillStyle='#fff';g.fillRect(-23,21,11,7);g.fillRect(13,21,11,7);g.fillStyle='#e52d3e';g.fillRect(-16,35,13,8+b);g.fillRect(4,35,13,8-b);g.restore()}
function ring(it){const X=it.x-cam,Y=it.y;g.save();g.translate(X,Y);g.strokeStyle='#ffd83d';g.lineWidth=7;g.shadowBlur=15;g.shadowColor='#ffd83d';g.beginPath();g.ellipse(0,0,14,20,0,0,Math.PI*2);g.stroke();g.shadowBlur=0;g.restore()}
function draw(){const sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#43b9ee');sky.addColorStop(.62,'#b7f2ff');sky.addColorStop(.621,'#6dd36b');sky.addColorStop(1,'#278d47');g.fillStyle=sky;g.fillRect(0,0,W,H);for(let i=0;i<14;i++){let bx=i*430-cam*.2;g.fillStyle='#74cf96';g.beginPath();g.arc(bx+100,380,120,Math.PI,Math.PI*2);g.fill();g.fillStyle='#4cb276';g.beginPath();g.arc(bx+270,400,145,Math.PI,Math.PI*2);g.fill()}for(const q of plats){g.fillStyle='#7b5539';g.fillRect(q.x-cam,q.y,q.w,q.h);g.fillStyle='#31b85a';g.fillRect(q.x-cam,q.y,q.w,9);for(let z=q.x+20;z<q.x+q.w;z+=44){g.fillStyle='#a8784e';g.fillRect(z-cam,q.y+18,4,q.h-18)}}for(const b of boosts)if(b.x>0){g.fillStyle='#fff';g.beginPath();g.arc(b.x-cam,b.y,18,0,Math.PI*2);g.fill();g.fillStyle='#f24b42';g.font='900 16px Arial';g.fillText('S',b.x-cam-6,b.y+6)}for(const it of items)if(!it.got)ring(it);const fx=5940-cam;g.fillStyle='#fff';g.fillRect(fx,390,9,130);g.fillStyle='#e83d46';g.beginPath();g.moveTo(fx+9,397);g.lineTo(fx+90,420);g.lineTo(fx+9,443);g.closePath();g.fill();g.fillStyle='#fff';g.font='900 20px Arial';g.fillText(rings===12&&done===12?'FINISH!':'LOCKED',fx-20,372);drawSonic();g.fillStyle='#123466';g.font='900 22px Arial';g.fillText('Vocabulary Revision',20,32);g.font='bold 14px Arial';g.fillStyle='#14557b';g.fillText('RUN FAST • COLLECT RINGS • SOLVE VOCABULARY • FINISH!',20,56)}
function loop(){update();draw();requestAnimationFrame(loop)}
document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{audioInit();answer(+b.dataset.i)});E('sound').onclick=()=>{audioInit();if(music){stopMusic();E('sound').textContent='🔇 Sound OFF'}else{E('sound').textContent='🔊 Sound ON';startMusic()}};E('again').onclick=()=>{audioInit();reset();startMusic()};E('resume').onclick=()=>{paused=false;E('pause').classList.remove('show');startMusic()};E('pause').onclick=()=>{if(ended||asking)return;paused=!paused;E('pause').classList.toggle('show',paused);if(paused)stopMusic();else startMusic()};document.querySelectorAll('.ctrl[data-k]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();audioInit();if(b.dataset.k==='jump')jump();else keys[b.dataset.k==='left'?'l':'r']=true};b.onpointerup=e=>{if(b.dataset.k!=='jump')keys[b.dataset.k==='left'?'l':'r']=false};b.onpointerleave=e=>{if(b.dataset.k!=='jump')keys[b.dataset.k==='left'?'l':'r']=false}});document.onkeydown=e=>{audioInit();const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a'){keys.l=true;e.preventDefault()}if(k==='arrowright'||k==='d'){keys.r=true;e.preventDefault()}if(k==='arrowup'||k==='w'||k===' '){jump();e.preventDefault()}if(k==='p')E('pause').click()};document.onkeyup=e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')keys.l=false;if(k==='arrowright'||k==='d')keys.r=false};
reset();loop();
})();
</script>
</body>
</html>
