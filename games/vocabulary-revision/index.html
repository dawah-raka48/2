<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vocabulary Revision</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050b20;color:#fff;font-family:"Trebuchet MS",Arial,sans-serif}main{max-width:1400px;margin:auto;padding:8px}.top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.title{font-size:clamp(23px,4vw,40px);font-weight:900}.title b{color:#ffd83d}.btn,.stat{background:#101f4c;border:2px solid #4d72d8;color:#fff;border-radius:13px;font-weight:900}.btn{padding:9px 12px;text-decoration:none;cursor:pointer}.stats{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}.stat{padding:7px 10px}.stage{position:relative;margin-top:7px;border:5px solid #355bc2;border-radius:24px;overflow:hidden;background:#56c8f1;box-shadow:0 18px 60px #000b}.stage canvas{display:block;width:100%;height:auto;touch-action:none}.stage #heroArt{position:absolute;z-index:3;left:50%;bottom:7%;width:clamp(115px,13vw,190px);max-height:58%;object-fit:contain;object-position:center bottom;transform:translateX(-50%);pointer-events:none;filter:drop-shadow(0 8px 5px #0006);transition:left .08s linear,bottom .08s linear}@media(max-width:650px){.stage #heroArt{width:125px;bottom:8%}}.touch{display:flex;justify-content:center;gap:9px;padding:8px}.touch button{width:74px;height:52px;background:#12275a;border:2px solid #5075dc;color:#fff;border-radius:14px;font-size:24px;font-weight:900}.help{text-align:center;color:#cbd7f5;font-size:13px;font-weight:800;margin:2px}.modal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#020817e8;padding:12px}.modal.show{display:flex}.card{width:min(720px,94%);background:#fff;color:#172449;border:5px solid #ffd83d;border-radius:25px;padding:22px;text-align:center;box-shadow:0 18px 55px #000c}.card h2{margin:0 0 8px;color:#6532b9}.context{font-size:21px;font-weight:900;background:#edf5ff;padding:12px;border-radius:14px}.target{color:#6636ca;text-decoration:underline}.hint{background:#fff3bd;border-radius:12px;padding:8px;margin:9px 0;font-weight:900}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.answer,.again{border:0;border-radius:14px;padding:14px;font-size:17px;font-weight:900;color:#fff;cursor:pointer}.answer:nth-child(1){background:#287de7}.answer:nth-child(2){background:#ef7a32}.answer:nth-child(3){background:#29b967}.again{background:#7040b8;margin-top:9px}.feedback{min-height:26px;margin-top:9px;font-weight:900}@media(max-width:650px){.stats{width:100%;margin-left:0}.stat{font-size:11px}.answers{grid-template-columns:1fr}.context{font-size:17px}}
</style>
</head>
<body>
<main>
<header class="top"><div class="title">Vocabulary <b>Revision</b></div><a class="btn" href="../../">← Game Hub</a><button class="btn" id="music">🔊 SOUND ON</button><div class="stats"><div class="stat">💍 <b id="rings">0</b>/12</div><div class="stat">⭐ <b id="score">0</b></div><div class="stat">❤️ <b id="lives">3</b></div><div class="stat">🧠 <b id="done">0</b>/12</div></div></header>
<section class="stage"><canvas id="game" width="1400" height="720"></canvas><img id="heroArt" src="https://www.vhv.rs/dpng/d/58-582981_sonic-the-hedgehog-hd-png-download.png" alt="3D Sonic character" crossorigin="anonymous">
<div class="modal" id="question"><div class="card"><h2>⚡ VOCABULARY CHALLENGE</h2><div class="hint">Use the context clue to choose the meaning.</div><div class="context" id="sentence"></div><p>What does <span class="target" id="word"></span> mean?</p><div class="answers"><button class="answer" data-i="0"></button><button class="answer" data-i="1"></button><button class="answer" data-i="2"></button></div><div class="feedback" id="feedback"></div></div></div>
<div class="modal" id="end"><div class="card"><h2 id="endTitle"></h2><p id="endText"></p><button class="again" id="again">🔄 PLAY AGAIN</button></div></div>
</section>
<div class="touch"><button data-k="left">◀</button><button data-k="forward">▲ RUN</button><button data-k="jump">⬆ JUMP</button><button data-k="right">▶</button><button id="pause">⏸</button></div>
<p class="help">3D RUNNER • أنت تتحكم في الجري • W / ▲ RUN • A,D / ◀ ▶ للحركة • SPACE / JUMP • Collect rings • Answer every vocabulary challenge</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),scene=new THREE.Scene();scene.background=new THREE.Color(0x55c9f2);scene.fog=new THREE.Fog(0x55c9f2,35,125);
const camera=new THREE.PerspectiveCamera(58,1400/720,.1,300);camera.position.set(0,4.8,12);camera.lookAt(0,2.0,0);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(1400,720,false);renderer.shadowMap.enabled=true;
scene.add(new THREE.HemisphereLight(0xcdf7ff,0x30552d,2.2));const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(-8,18,10);sun.castShadow=true;scene.add(sun);
const qs=[
['goal','Kick the ball into the goal to score.','the place where you score',['the place where you score','a person who drives a train','a storm in the sky']],
['goalie','The goalie stopped the ball with his hands.','the player who protects the goal',['the player who protects the goal','people watching a game','a place in outer space']],
['leader','The children follow the leader in the game.','a person others follow',['a person others follow','a train worker','a strong storm']],
['stands','The people in the stands cheer for the team.','seats where people watch a game',['seats where people watch a game','a moving train','a fancy dinner plate']],
['aboard','We climbed aboard the train.','onto or into a vehicle',['onto or into a vehicle','very expensive','bright lightning']],
['conductor','The conductor tells when the train leaves.','a person who works on a train',['a person who works on a train','a soccer player','a storm cloud']],
['fancy','The table has fancy plates.','special and beautiful',['special and beautiful','very loud','a place with stars']],
['space','There are many stars in space.','the area beyond Earth',['the area beyond Earth','people in a stadium','a train worker']],
['hail','Icy hail fell during the storm.','small balls of ice that fall from the sky',['small balls of ice that fall from the sky','a bright flash of light','a spinning storm']],
['lightning','The lightning from the storm lit up the sky.','a bright flash of electricity in the sky',['a bright flash of electricity in the sky','loud storm sound','a soccer goal']],
['thunder','The thunder was so loud that it hurt my ears.','a loud sound during a storm',['a loud sound during a storm','ice falling from the sky','a team leader']],
['tornado','The tornado destroyed everything in its path.','a powerful spinning column of air',['a powerful spinning column of air','a train worker','a beautiful plate']]
];
let score=0,rings=0,lives=3,done=0,qi=0,paused=false,asking=false,ended=false,audio=null,musicTimer=null,worldZ=0,lane=0,targetLane=0,jumpY=0,jumpV=0,runT=0,speed=0.0,spawn=0;const heroArt=document.getElementById('heroArt');let moveKeys={left:false,right:false,forward:false,back:false};
const E=id=>document.getElementById(id),objects=[],ringObjects=[],obstacles=[];
function mat(c,rough=.65,metal=0){return new THREE.MeshStandardMaterial({color:c,roughness:rough,metalness:metal})}
function box(w,h,d,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.castShadow=true;m.receiveShadow=true;return m}
function resetWorld(){objects.splice(0);ringObjects.splice(0);obstacles.splice(0);while(scene.children.length>2)scene.remove(scene.children[2]);worldZ=0;lane=0;targetLane=0;jumpY=0;jumpV=0;spawn=0;buildTrack();buildHero();for(let i=0;i<12;i++)addRing(-18-i*18,(i%3)-1);for(let i=0;i<7;i++)addObstacle(-45-i*42,(i%3)-1)}
function buildTrack(){for(let i=0;i<45;i++){const z=-i*6;const road=box(14,.45,6,0x505b6c);road.position.set(0,-.45,z);scene.add(road);objects.push(road);for(let l=-1;l<=1;l++){const line=box(.12,.03,5,0xf6f6f6);line.position.set(l*2.35,-.19,z);scene.add(line);objects.push(line)}for(let s=-1;s<=1;s+=2){const curb=box(.8,.65,6,s<0?0x34b95e:0x34b95e);curb.position.set(s*7.2,-.15,z);scene.add(curb)}if(i%4===0){for(let s=-1;s<=1;s+=2){const t=makeTree();t.position.set(s*(9+Math.random()*3),1,z);scene.add(t);objects.push(t)}}}}
function makeTree(){const g=new THREE.Group();const trunk=box(.45,2,.45,0x7b4b2b);trunk.position.y=0;g.add(trunk);const crown=new THREE.Mesh(new THREE.SphereGeometry(1.5,14,10),mat(0x2da65b));crown.position.y=1.7;crown.castShadow=true;g.add(crown);return g}
let hero;
function buildHero(){hero=new THREE.Group();const blue=mat(0x1769e8,.4,.1),red=mat(0xe5393f,.45,.05),white=mat(0xffffff,.35);const body=new THREE.Mesh(new THREE.SphereGeometry(.85,20,16),blue);body.scale.set(.8,1.1,.7);body.position.y=1.15;hero.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(1.05,20,16),blue);head.position.y=2.35;hero.add(head);for(let i=0;i<6;i++){const spike=new THREE.Mesh(new THREE.ConeGeometry(.28,1.35,10),blue);spike.rotation.x=-Math.PI/2;spike.rotation.z=(i-2.5)*.18;spike.position.set((i-2.5)*.3,2.65,.35);hero.add(spike)}const face=new THREE.Mesh(new THREE.SphereGeometry(.65,16,12),mat(0xf2c39e));face.scale.set(1,.8,.45);face.position.set(0,2.18,.82);hero.add(face);for(const x of[-.25,.25]){const eye=new THREE.Mesh(new THREE.SphereGeometry(.17,12,8),white);eye.position.set(x,2.45,1.18);hero.add(eye)}for(const x of[-.65,.65]){const shoe=new THREE.Mesh(new THREE.BoxGeometry(.8,.38,1.25),red);shoe.position.set(x,.2,.25);hero.add(shoe)}hero.position.set(0,jumpY,2.8);hero.castShadow=true;scene.add(hero)}
function addRing(z,l){const r=new THREE.Mesh(new THREE.TorusGeometry(.55,.14,12,28),mat(0xffd52e,.25,.65));r.position.set(l*2.35,1.45,z);r.rotation.y=Math.PI/2;r.userData={hit:false};scene.add(r);ringObjects.push(r)}
function addObstacle(z,l){const o=new THREE.Group();const base=box(1.4,1.2,1.2,0xff5a3c);base.position.y=.35;o.add(base);const top=box(1.65,.2,1.4,0x3b3b52);top.position.y=1.05;o.add(top);o.position.set(l*2.35,0,z);o.userData.hit=false;scene.add(o);obstacles.push(o)}
function stats(){E('rings').textContent=rings;E('score').textContent=score;E('lives').textContent=lives;E('done').textContent=done}
function audioInit(){if(audio){audio.resume();return}try{audio=new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch(e){}}
function tone(f,d,t='square',v=.05,delay=0){if(!audio)return;const o=audio.createOscillator(),a=audio.createGain();o.type=t;o.frequency.value=f;a.gain.setValueAtTime(.0001,audio.currentTime+delay);a.gain.exponentialRampToValueAtTime(v,audio.currentTime+delay+.01);a.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+delay+d);o.connect(a);a.connect(audio.destination);o.start(audio.currentTime+delay);o.stop(audio.currentTime+delay+d+.03)}
function music(){if(musicTimer||!audio)return;let n=0;const notes=[330,392,494,523,440,392,330,494];musicTimer=setInterval(()=>{if(!paused&&!asking&&!ended){tone(notes[n%8],.11,'square',.025);if(n%2===0)tone(165,.08,'triangle',.018)}n++},150)}
function stopMusic(){clearInterval(musicTimer);musicTimer=null}
function ask(){asking=true;paused=true;const q=qs[qi++%12];E('word').textContent=q[0];E('sentence').innerHTML=q[1].replace(q[0],'<span class="target">'+q[0]+'</span>');document.querySelectorAll('.answer').forEach((b,i)=>b.textContent=q[3][i]);E('question').dataset.a=q[2];E('feedback').textContent='';E('question').classList.add('show');tone(880,.14,'sine',.05)}
function answer(i){if(!asking)return;const q=qs[(qi-1)%12];if(q[3][i]===q[2]){score+=80;done++;stats();tone(523,.08);tone(659,.09,'square',.06,.08);tone(784,.13,'square',.06,.17);E('feedback').textContent='🎉 Correct! Keep running!';E('feedback').style.color='#168d49';setTimeout(()=>{E('question').classList.remove('show');asking=false;paused=false;music()},650)}else{lives--;stats();tone(150,.16,'sawtooth',.06);E('feedback').textContent=lives?'❌ Try again! -1 ❤️':'❌ No lives left!';E('feedback').style.color='#d33b5f';if(!lives)setTimeout(()=>finish(false),800)}}
function finish(win){ended=true;paused=true;stopMusic();E('endTitle').textContent=win?'🏆 VOCABULARY SUPERSTAR!':'💙 NICE TRY!';E('endText').textContent=win?'12 rings + 12 vocabulary challenges + finish line! Score: '+score:'You collected '+rings+' rings and solved '+done+' challenges.';E('end').classList.add('show');if(win){tone(523,.12);tone(659,.12,'triangle',.08,.12);tone(784,.16,'triangle',.08,.24)}}
function move(dir){targetLane=Math.max(-1,Math.min(1,targetLane+dir));audioInit();tone(240,.05,'square',.035)}
function jump(){if(asking||ended||paused||jumpY>0)return;audioInit();jumpV=.25;tone(430,.08,'square',.05)}
function reset(){score=0;rings=0;lives=3;done=0;qi=0;paused=false;asking=false;ended=false;stats();E('question').classList.remove('show');E('end').classList.remove('show');resetWorld()}
function loop(){requestAnimationFrame(loop);if(!paused&&!asking&&!ended){const moving=moveKeys.forward||moveKeys.back||moveKeys.left||moveKeys.right;speed=moving?Math.min(.62,speed+.018):Math.max(0,speed-.035);runT+=speed*2.2;worldZ+=speed;lane+=(targetLane-lane)*.18;jumpV-=.014;jumpY+=jumpV;if(jumpY<0){jumpY=0;jumpV=0}hero.position.x=lane*2.35;hero.position.y=jumpY;hero.rotation.z=(targetLane-lane)*.12;hero.rotation.y=Math.sin(runT)*.025;heroArt.style.left=(50+lane*13)+'%';heroArt.style.bottom=(7+jumpY*4)+'%';for(const o of objects)o.position.z+=speed;if(objects.length&&objects[0].position.z>15){const o=objects.shift();o.position.z=-250;objects.push(o)}for(const r of ringObjects){r.position.z+=speed;r.rotation.z+=.08;if(!r.userData.hit&&r.position.z>3.7&&r.position.z<6.5&&Math.abs(r.position.x-hero.position.x)<1.1&&Math.abs(r.position.y-(hero.position.y+1.45))<1.5){r.userData.hit=true;r.visible=false;rings++;score+=20;stats();tone(720,.08,'triangle',.08);tone(980,.1,'triangle',.06,.08);ask();break}}for(const o of obstacles){o.position.z+=speed;if(!o.userData.hit&&o.position.z>4.1&&o.position.z<6.2&&Math.abs(o.position.x-hero.position.x)<1.35&&jumpY<1){o.userData.hit=true;lives--;stats();tone(140,.18,'sawtooth',.06);if(lives<=0)finish(false)}}if(rings===12&&done===12&&worldZ>820)finish(true)}renderer.render(scene,camera)}
document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{audioInit();answer(+b.dataset.i)});E('again').onclick=()=>{audioInit();reset();music()};E('music').onclick=()=>{audioInit();if(musicTimer){stopMusic();E('music').textContent='🔇 SOUND OFF'}else{music();E('music').textContent='🔊 SOUND ON'}};E('pause').onclick=()=>{if(ended||asking)return;paused=!paused;E('pause').textContent=paused?'▶':'⏸';if(paused)stopMusic();else{audioInit();music()}};document.querySelectorAll('.touch button[data-k]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();audioInit();const k=b.dataset.k;if(k==='jump')jump();else if(k==='left')moveKeys.left=true,move(-1);else if(k==='right')moveKeys.right=true,move(1);else if(k==='forward')moveKeys.forward=true;else if(k==='back')moveKeys.back=true};b.onpointerup=e=>{const k=b.dataset.k;if(k==='left')moveKeys.left=false;if(k==='right')moveKeys.right=false;if(k==='forward')moveKeys.forward=false;if(k==='back')moveKeys.back=false};b.onpointerleave=e=>{const k=b.dataset.k;if(k==='left')moveKeys.left=false;if(k==='right')moveKeys.right=false;if(k==='forward')moveKeys.forward=false;if(k==='back')moveKeys.back=false}});document.onkeydown=e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a'){moveKeys.left=true;move(-1);e.preventDefault()}if(k==='arrowright'||k==='d'){moveKeys.right=true;move(1);e.preventDefault()}if(k==='arrowup'||k==='w'){moveKeys.forward=true;e.preventDefault()}if(k==='arrowdown'||k==='s'){moveKeys.back=true;e.preventDefault()}if(k===' '){jump();e.preventDefault()}if(k==='p')E('pause').click()};document.onkeyup=e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')moveKeys.left=false;if(k==='arrowright'||k==='d')moveKeys.right=false;if(k==='arrowup'||k==='w')moveKeys.forward=false;if(k==='arrowdown'||k==='s')moveKeys.back=false};let sx=0,sy=0;canvas.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});canvas.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>35)move(dx>0?1:-1);else if(dy<-35)jump()},{passive:true});
window.addEventListener('resize',()=>{const w=canvas.clientWidth,h=w*720/1400;renderer.setSize(1400,720,false);camera.aspect=1400/720;camera.updateProjectionMatrix()});
reset();hero.visible=false;heroArt.style.left='50%';heroArt.style.bottom='7%';loop();
})();
</script>
</body></html>
